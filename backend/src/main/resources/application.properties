spring.application.name=rutaia-api

# Variables del .env de la raíz del repositorio (bootRun se ejecuta desde backend/).
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL. La contraseña no tiene valor por defecto: si falta, el arranque se detiene.
spring.datasource.url=${RUTAIA_DB_URL:jdbc:postgresql://127.0.0.1:5433/rutaia}
spring.datasource.username=${RUTAIA_DB_USER:rutaia_app}
spring.datasource.password=${RUTAIA_DB_PASSWORD}

# El esquema lo crean solo los scripts de database/.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JSON: un decimal no se acepta donde se espera un entero (duracionHoras).
spring.jackson.deserialization.accept-float-as-int=false

# Flujo W-1 «RutaIA - Consulta RAG» de n8n (C8 y C11). Connect timeout fijo de 5 s; este es el read timeout.
rutaia.n8n.webhook-url=${RUTAIA_N8N_WEBHOOK_URL:http://127.0.0.1:5678/webhook/rutaia-consulta-rag}
rutaia.n8n.timeout-segundos=${RUTAIA_N8N_TIMEOUT_SEGUNDOS:90}

# CORS para /api/**
rutaia.cors.origins=${RUTAIA_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
# Enlaces directos a cada operación (por ejemplo, /swagger-ui/index.html#/Estudiantes/registrarEstudiante).
springdoc.swagger-ui.deep-linking=true
